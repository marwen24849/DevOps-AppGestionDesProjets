version: "3.9"

services:
  mysql:
    image: mysql:8.0.27
    container_name: projet_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: test_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    image: "${DOCKER_REGISTRY:-docker.io}/${DOCKER_NAMESPACE:-local}/projet-backend:${IMAGE_TAG:-latest}"
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: projet_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8091:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/test_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8080
    networks:
      - app-network

  frontend:
    image: "${DOCKER_REGISTRY:-docker.io}/${DOCKER_NAMESPACE:-local}/projet-frontend:${IMAGE_TAG:-latest}"
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: projet_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "4200:4200"
    networks:
      - app-network

volumes:
  mysql_data:
    driver: local

networks:
  app-network:
    driver: bridge
