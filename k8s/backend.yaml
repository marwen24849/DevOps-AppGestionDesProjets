apiVersion: apps/v1
kind: Deployment
metadata:
  name: projet-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: projet-backend
  template:
    metadata:
      labels:
        app: projet-backend
    spec:
      containers:
        - name: backend
          image: docker.io/marwen695/projet-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/test_db?createDatabaseIfNotExist=true
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
            - name: SERVER_PORT
              value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: projet-backend
spec:
  type: ClusterIP
  selector:
    app: projet-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
