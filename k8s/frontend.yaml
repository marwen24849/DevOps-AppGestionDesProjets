apiVersion: apps/v1
kind: Deployment
metadata:
  name: projet-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: projet-frontend
  template:
    metadata:
      labels:
        app: projet-frontend
    spec:
      containers:
        - name: frontend
          image: docker.io/marwen695/projet-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4200
---
apiVersion: v1
kind: Service
metadata:
  name: projet-frontend
spec:
  type: NodePort
  selector:
    app: projet-frontend
  ports:
    - name: http
      port: 4200
      targetPort: 4200
      nodePort: 30200
